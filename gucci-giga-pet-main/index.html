<!DOCTYPE html>
<html>

<head>
  <title>Gucci Giga Pet</title>
  <meta name="description" content="My Gucci Giga Pet Game">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>Gucci Giga Pet</h1>
  </header>

  <main>
    <!-- Gucci's Pet Image -->
    <section class="pet-image-container">
      <img class="pet-image" src="images/gucci-default.jpeg" alt="Gucci the French Bulldog">
    </section>

    <!-- Gucci's Information Dashboard -->
    <section class="dashboard">
      <div>
        Name: <strong><span class="name"></span></strong>
      </div>

      <div>
        Weight: <strong><span class="weight"></span> lbs</strong>
      </div>

      <div>
        Happiness: <strong><span class="happiness"></span> tail wags/min</strong>
      </div>

      <div>
        Energy: <strong><span class="energy"></span>%</strong>
      </div>

      <!-- Gucci's reactions -->
      <p class="pet-message">Woof! What should we do today?</p>

      <!-- Pet Interaction Buttons -->
      <div class="button-container">
        <button class="treat-button">Treat</button>
        <button class="play-button">Play</button>
        <button class="exercise-button">Exercise</button>
        <button class="sleep-button">Sleep</button>
        <button class="default-button">Default</button>
      </div>

      <!-- jQuery Library -->
      <script src="https://code.jquery.com/jquery-2.2.1.min.js"
        integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00=" crossorigin="anonymous">
        </script>
</body>

</html>
